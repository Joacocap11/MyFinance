name: CI

on:
  push:
    branches: [main, feat/autentificacion]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myfinance_ci
          POSTGRES_USER: myfinance
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myfinance -d myfinance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Validate PostgreSQL migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://myfinance:ci-password@localhost:5432/myfinance_ci
          JWT_SECRET: ci-only-secret
        run: uv run alembic upgrade head
      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests
      - name: Tests
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Lint
        working-directory: mobile
        run: npm run lint
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Tests
        working-directory: mobile
        run: npm test -- --watch=false
