services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfinance}
      POSTGRES_USER: ${POSTGRES_USER:-myfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-myfinance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myfinance}}
      PGDATABASE: ${POSTGRES_DB:-myfinance}
      PGUSER: ${POSTGRES_USER:-myfinance}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGPORT: 5432
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      MAX_USERS: ${MAX_USERS:-5}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - target: 8000
        published: "${BACKEND_PORT:-8000}"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - target: 80
        published: "${FRONTEND_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
